spring:
  application:
    name: backend
  datasource:
    hikari:
      # Never wait forever for a row lock (a stalled sender must not block a whole conversation).
      connection-init-sql: SET lock_timeout = '5s'
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  mvc:
    problemdetails:
      enabled: true
  threads:
    virtual:
      enabled: true
  mail:
    host: localhost
    port: 1025

app:
  mail-from: no-reply@messenger.local
  refresh-cookie:
    secure: ${REFRESH_COOKIE_SECURE:true}
  lookup:
    max-per-minute: 30
  groups:
    max-created-per-hour: 20
  messages:
    max-sends-per-minute: 60
    max-changes-per-minute: 120
    edit-window: 15m
    delete-window: 1h
  storage:
    # Images are files under this directory; links to them are signed with the secret and expire.
    directory: ${STORAGE_DIRECTORY:data/uploads}
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:http://localhost:8080}
    signing-secret: ${STORAGE_SIGNING_SECRET:dev-only-change-me-too}
    url-ttl: 15m
  uploads:
    max-per-minute: 20
    unattached-lifetime: 24h
    cleanup-interval: 10m
  push:
    max-devices-per-user: 10
    retry-delay: 30s
    max-attempts: 5
    fcm:
      credentials-file: ${FCM_CREDENTIALS_FILE:}
  presence:
    ttl: 30s
    offline-grace: 5s
    sweep-interval: 2s
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:3001
  jwt:
    issuer: messenger-backend
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    # PEM (PKCS8 private / X.509 public) EC P-256 keys. When unset an ephemeral
    # key pair is generated at startup, so tokens do not survive a restart.
    private-key:
    public-key:
  otp:
    secret: dev-only-change-me
    ttl: 10m
    max-attempts: 5
    max-sends-per-hour: 5
    max-sends-per-ip-per-hour: 20
