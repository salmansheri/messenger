spring:
  application:
    name: backend
  datasource:
    hikari:
      # Never wait forever for a row lock (a stalled sender must not block a whole conversation).
      connection-init-sql: SET lock_timeout = '5s'
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true
  threads:
    virtual:
      enabled: true
  mail:
    host: localhost
    port: 1025

app:
  mail-from: no-reply@messenger.local
  refresh-cookie:
    secure: true
  lookup:
    max-per-minute: 30
  cors:
    allowed-origins:
      - http://localhost:3000
  jwt:
    issuer: messenger-backend
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    # PEM (PKCS8 private / X.509 public) EC P-256 keys. When unset an ephemeral
    # key pair is generated at startup, so tokens do not survive a restart.
    private-key:
    public-key:
  otp:
    secret: dev-only-change-me
    ttl: 10m
    max-attempts: 5
    max-sends-per-hour: 5
    max-sends-per-ip-per-hour: 20
